version: 2

updates:
  - package-ecosystem: composer
    directory: /
    # `directory: /` already keeps version updates off tests/stubs. There was an
    # `exclude-paths:` key here trying to do the same thing; it is not a
    # Dependabot option, so it was silently ignored and never excluded anything.
    #
    # It would not have helped regardless: security updates scan every manifest
    # in the repository whatever `directory` says. tests/stubs/valid/Recipe is a
    # scaffolding fixture — an asgard-module frozen at php >=5.4 to exercise the
    # reader — and its phpunit ~4.0 is what raises the alert. Nothing installs
    # it, so the alert is dismissed as not-used rather than "fixed" by bumping
    # one line of a fixture whose whole point is being old.
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(actions)'
      include: scope
