name: PHP Pipeline

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      max-parallel: 2
      matrix:
        php-versions: ['8.4', '8.5']

    name: PHP ${{ matrix.php-versions }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ matrix.php-versions }}
        # No driver: nothing consumed the report, and pcov instruments every
        # file on every run. Restore with an upload or a --min gate.
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Resolve composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Restore composer cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
        restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

    - name: Drop cached laranail archives
      # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
      # cache is keyed on a name whose contents change underneath it. A restored
      # archive is then silently stale: the install reports success and unpacks
      # whatever was cached the first time. Everything else is immutable per
      # version and stays cached.
      # POSIX command via bash: Windows runners default to PowerShell, where this
      # would be a parse error rather than a no-op.
      shell: bash
      run: rm -rf "$(composer config cache-files-dir)/laranail"

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run static analysis
      run: composer run-script analyse

    - name: Run test suite
      run: composer run-script test
  # Checks the style, does not rewrite it. Every other package in the family
  # runs `pint --test` and fails; this one auto-committed the fix back to main,
  # which had two costs. A push arrived on main that nobody wrote, so a local
  # branch was silently behind and the next push was rejected. And pre-1.0 the
  # tag is supposed to track main, so an unattended commit left the tag one
  # behind and consumers on `^0.1` never received it.
  #
  # Run `composer pint-fix` (or `vendor/bin/pint`) before pushing.
  phplint:
      permissions:
          contents: read
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          # Was aglipanci/laravel-pint-action with `configPath: ./pint.json` - a
          # file this package does not have. Pint silently falls back to its own
          # defaults when handed a config path that does not exist, so this job
          # was reporting on a rule set nobody chose, and disagreed with
          # `composer pint` (which runs the shared laranail config through
          # laranail-pint). Same binary as the composer script now.
          - name: Setup PHP
            uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
            with:
                php-version: '8.4'
                coverage: none

          - name: Resolve composer cache directory
            id: composer-cache
            shell: bash
            run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

          - name: Restore composer cache
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: ${{ steps.composer-cache.outputs.dir }}
              key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
              restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

          - name: Drop cached laranail archives
            # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
            # cache is keyed on a name whose contents change underneath it. A restored
            # archive is then silently stale: the install reports success and unpacks
            # whatever was cached the first time. Everything else is immutable per
            # version and stays cached.
            # POSIX command via bash: Windows runners default to PowerShell, where this
            # would be a parse error rather than a no-op.
            shell: bash
            run: rm -rf "$(composer config cache-files-dir)/laranail"

          - name: Install dependencies
            run: composer install --prefer-dist --no-progress

          - name: "laravel-pint"
            run: composer pint
