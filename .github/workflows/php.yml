name: PHP Pipeline

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      max-parallel: 2
      matrix:
        php-versions: ['8.4', '8.5']

    name: PHP ${{ matrix.php-versions }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2, was @master
      with:
        php-version: ${{ matrix.php-versions }}
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run static analysis
      run: composer run-script analyse

    - name: Run test suite
      run: composer run-script test
  # Checks the style, does not rewrite it. Every other package in the family
  # runs `pint --test` and fails; this one auto-committed the fix back to main,
  # which had two costs. A push arrived on main that nobody wrote, so a local
  # branch was silently behind and the next push was rejected. And pre-1.0 the
  # tag is supposed to track main, so an unattended commit left the tag one
  # behind and consumers on `^0.1` never received it.
  #
  # Run `composer pint-fix` (or `vendor/bin/pint`) before pushing.
  phplint:
      permissions:
          contents: read
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: "laravel-pint"
            uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6, was @latest
            with:
                configPath: './pint.json'
                testMode: true
