name: static-analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    name: Pint + PHPStan

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every action reference must match the org pinning rule, offline and exactly: a third-party
      # action on the commit SHA of a named release, a first-party one (actions/, docker/, github/)
      # floating on its current major. Whether that release is the newest is Dependabot's job and
      # laranail/package-tools' verify-action-pins.py; nothing checked the *shape* until this step,
      # A scaffolded package gets this on its first commit, because a template that seeds
      # the rule without seeding its guard seeds the drift too: 85 references across the
      # estate had gone off the rule by 2026-11-02 with every check green.
      - name: Action pins match the rule
        run: |
          python3 - <<'PINS'
          import os, re, sys
          d = ".github/workflows"
          files = sorted(f for f in os.listdir(d) if f.endswith((".yml", ".yaml")))
          floor = 1
          if len(files) < floor:
              sys.exit(f"{len(files)} workflow files in {d}; floor is {floor}. "
                       "A search that stops matching must fail, not report a clean repository.")
          # The step keyword is assembled from a variable rather than written out, so no
          # line here carries that keyword next to an "at" sign. A pin checker reading
          # this file would otherwise match the pattern inside this guard and report a
          # phantom third-party action. simtabi/repo-templates' render gate did exactly
          # that, once per stack; this repository has no such gate, so the literal form
          # passed here and would have shipped to every package scaffolded from it.
          key = "uses"
          uses = re.compile(rf"{key}:\s*([\w.-]+/[\w./-]+?)@([\w./-]+?)([ \t]*#[ \t]*(\S+))?\s*$", re.M)
          bad, seen = [], 0
          for name in files:
              for ref, at, _, note in uses.findall(open(os.path.join(d, name)).read()):
                  if ref.startswith("./") or "/.github/workflows/" in ref:
                      continue                      # a local action or a reusable-workflow call
                  seen += 1
                  if ref.startswith(("actions/", "docker/", "github/")):
                      if not re.fullmatch(r"v\d+", at) or note:
                          bad.append(f"{name}: {ref}@{at} -- first-party, so float on a bare major tag")
                  elif not re.fullmatch(r"[0-9a-f]{40}", at):
                      bad.append(f"{name}: {ref}@{at} -- third-party, so pin to a commit SHA")
                  elif not note or re.fullmatch(r"v?\d+", note):
                      bad.append(f"{name}: {ref}@{at[:12]} # {note} -- name the release, not a mutable major")
          print("\n".join(f"  {b}" for b in bad))
          print(f"{seen} action references in {len(files)} workflow files; {len(bad)} off the rule")
          sys.exit(1 if bad else 0)
          PINS

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress
